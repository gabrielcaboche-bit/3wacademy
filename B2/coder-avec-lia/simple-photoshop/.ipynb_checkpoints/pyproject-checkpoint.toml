[project]
name = "simple-photoshop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gabriel C", email = "gabcab1002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
]

[project.scripts]
simple-photoshop = "simple_photoshop:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
